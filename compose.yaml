services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DIGICARD_SQL_PASSWORD:?Set DIGICARD_SQL_PASSWORD in .env}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - digicard-sql:/var/opt/mssql
volumes:
  digicard-sql:
