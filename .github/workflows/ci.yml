name: build-and-test
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: CI_Only_Strong_Password_237!
        ports:
          - 1433:1433
    env:
      DIGICARD_TEST_SQL: "Server=localhost,1433;Database=DigiCardTests;User Id=sa;Password=CI_Only_Strong_Password_237!;TrustServerCertificate=True;ConnectRetryCount=10;ConnectRetryInterval=2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore DigiCard.sln
      - run: dotnet build DigiCard.sln -c Release --no-restore
      - run: dotnet test DigiCard.sln -c Release --no-build --logger trx
